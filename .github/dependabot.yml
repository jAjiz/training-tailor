version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    assignees:
      - jAjiz
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 1.16.13 breaks `next build` on the dev machine; pinned to 1.16.2.
      - dependency-name: "@swc/core"
      # Types follow the Node runtime (engines: 24.x); bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - jAjiz
    groups:
      actions:
        patterns:
          - "*"
